<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            /* Cambio de colores a tonos oscuros y nueva tipografía */
            background: linear-gradient(135deg, #232526, #414345);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
        }
        .converter-card {
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.90);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            /* Diseño responsive: usamos % en lugar de px fijos */
            width: 100%;
            max-width: 500px;
        }
        /* Estilos para la caja de resultado que faltaban en el CSS */
        .result-box {
            font-size: 1.5rem;
            font-weight: bold;
            color: #232526;
        }
        /* Ajuste responsive para pantallas pequeñas (móviles) */
        @media (max-width: 576px) {
            .converter-card {
                padding: 1.5rem !important; /* Reduce el padding interior */
            }
            .row { 
                flex-direction: column; 
            }
            .col { 
                margin-bottom: 10px; 
            }
            .arrow-col {
                transform: rotate(90deg); /* Gira la flecha hacia abajo en móviles */
                margin: 5px 0;
            }
        }
    </style>
</head>

<!-- Añadimos p-3 para asegurar que en móviles la tarjeta no se pegue a los bordes de la pantalla -->
<body class="d-flex justify-content-center align-items-center vh-100 p-3">

    <!-- ELIMINADO el style="width: 400px;" que rompía la adaptabilidad -->
    <div class="card shadow-lg p-4 converter-card">
        <h2 class="text-center mb-4">💱 Conversor de Divisas</h2>

        <form method="post">
            <div class="mb-3">
                <label class="form-label text-dark fw-bold">Cantidad</label>
                <input type="number" step="0.01" name="amount" 
                       class="form-control form-control-lg" 
                       placeholder="Introduce cantidad" required>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <select name="from_currency" class="form-select">
                        <option value="EUR">EUR €</option>
                        <option value="USD">USD $</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>
                <!-- Añadida la clase arrow-col para controlarla en móviles -->
                <div class="col text-center align-self-center arrow-col fs-4 fw-bold text-dark">
                    →
                </div>
                <div class="col">
                    <select name="to_currency" class="form-select">
                        <option value="USD">USD $</option>
                        <option value="EUR">EUR €</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>
            </div>

            <div class="d-grid">
                <!-- Botón adaptado al nuevo esquema de colores oscuro -->
                <button type="submit" class="btn btn-lg text-white" style="background-color: #232526;">
                    Convertir
                </button>
            </div>
        </form>

        {% if result is not none %}
            <div class="mt-4 text-center result-box">
                {{ result }}
            </div>
        {% endif %}
    </div>

</body>
</html>
